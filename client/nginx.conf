# NGINX configuration of the web container (Docker Compose). For a server deployment
# with HTTPS see deploy/nginx.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allows .eml uploads up to the 10 MB accepted by the API (default is 1 MB)
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Re-classifying many e-mails after a label change can take a while
        proxy_read_timeout 300s;
    }

    # Single-page application: unknown paths are handled by the Angular router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
