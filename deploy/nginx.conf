# NGINX configuration used to deploy Mail Space on a single EC2 instance:
# it serves the Angular build as static files and proxies /api to the Node.js server.
# Replace your-domain.com with your domain; the ssl_* lines are generated by Certbot
# (sudo certbot --nginx).

server {
    server_name your-domain.com;

    # Angular build (client/dist/mail-space/browser)
    root /var/www/mail-space/browser;
    index index.html;

    # Allows .eml uploads up to the 10 MB accepted by the API (default is 1 MB)
    client_max_body_size 10m;

    # REST API served by Node.js on the same host
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Re-classifying many e-mails after a label change can take a while
        proxy_read_timeout 300s;
    }

    # Single-page application: unknown paths are handled by the Angular router
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirects HTTP to HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
