# Continuous integration: lint, tests and builds on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # Throwaway database for the integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailspace
          POSTGRES_PASSWORD: mailspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  client:
    name: Web app (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag mail-space-api ./server
      - run: docker build --tag mail-space-web ./client
